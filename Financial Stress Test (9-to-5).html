<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Financial Stress Test</title>
<style>
:root{
  /* 1%er brand kit. Single theme by choice: black field, gold marks.
     Layout: one question per screen, phone-first, 560px column. */
  --black:#08070a;
  --panel:#131216;
  --line:#2a2730;
  --gold:#e8c574;
  --gold-deep:#937245;
  --text:#eae6de;
  --muted:#a39d92;
  --good:#7fbf8a;
  --warn:#e0a94f;
  --bad:#d9705f;
  --display:Georgia,"Times New Roman",serif;
  --body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --grad:linear-gradient(135deg,#8a6a3e,#e8c574 42%,#f3d99b 68%,#c9a75c);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--black);color:var(--text);font-family:var(--body);font-size:17px;line-height:1.5}
body{padding:20px 16px 48px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.brand{font-family:var(--display);text-transform:uppercase;letter-spacing:.26em;font-size:12px;color:var(--gold)}
h1,h2,h3{font-family:var(--display);font-weight:normal;margin:0;text-wrap:balance}
h1{font-size:34px;line-height:1.15}
h2{font-size:23px;line-height:1.25}
h3{font-size:18px;color:var(--gold)}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:14px}
.eyebrow{font-family:var(--display);text-transform:uppercase;letter-spacing:.2em;font-size:12px;color:var(--gold)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:12px}
.stack{display:flex;flex-direction:column;gap:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:420px){.two{grid-template-columns:1fr}}
.rule{height:1px;background:var(--grad);border:0;margin:0;opacity:.7}

button{font:inherit;color:inherit;cursor:pointer}
.btn{background:var(--grad);color:#1a1408;border:0;border-radius:8px;padding:14px 20px;font-weight:700;font-size:16px;min-height:50px}
.btn[disabled]{opacity:.35;cursor:not-allowed}
.btn.ghost{background:none;color:var(--gold);border:1px solid var(--gold-deep);font-weight:600}
.nav{display:flex;gap:12px}
.nav .btn{flex:1}
.nav .btn.ghost{flex:0 0 auto}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.opt{display:block;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-height:54px;line-height:1.35}
.opt:hover{border-color:var(--gold-deep)}
.opt[aria-pressed="true"]{border-color:var(--gold);background:#1d1a14;box-shadow:inset 3px 0 0 var(--gold)}

.drive{display:flex;flex-direction:column;gap:6px}
.drive-top{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.track{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.fill{height:100%;background:var(--grad);width:0;transition:width .25s}
@media (prefers-reduced-motion:reduce){.fill{transition:none}}

.hit{background:#1a1210;border:1px solid #4a2c26;border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.hit .big{font-family:var(--display);font-size:28px;font-variant-numeric:tabular-nums}
.hit .big b{color:var(--bad);font-weight:normal}

label{font-size:14px;color:var(--muted)}
.money{display:flex;align-items:center;gap:8px;background:var(--black);border:1px solid var(--gold-deep);border-radius:8px;padding:0 14px}
.money span{color:var(--gold);font-family:var(--display);font-size:22px}
.money input{flex:1;min-width:0;background:none;border:0;color:var(--text);font:inherit;font-size:22px;padding:12px 0;font-variant-numeric:tabular-nums}
.money input:focus{outline:none}
.money:focus-within{outline:2px solid var(--gold);outline-offset:2px}

.meter{display:flex;flex-direction:column;gap:8px}
.meter-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.meter-head .num{font-family:var(--display);font-size:30px;font-variant-numeric:tabular-nums}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.pill.low{background:#3a1e19;color:var(--bad)}
.pill.mid{background:#3a2c14;color:var(--warn)}
.pill.high{background:#1b3020;color:var(--good)}
.bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%}
.bar i.low{background:var(--bad)} .bar i.mid{background:var(--warn)} .bar i.high{background:var(--good)}

.profile{border:1px solid var(--gold);border-radius:12px;padding:20px;background:linear-gradient(180deg,#1a1710,#131216);display:flex;flex-direction:column;gap:10px}
.profile h2{font-size:30px;color:var(--gold)}

table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.n.loss{color:var(--bad)}
ul.fix{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
ul.fix li{border-left:3px solid var(--warn);padding:2px 0 2px 12px}
ul.fix li b{display:block;color:var(--text)}
ul.fix li span{color:var(--muted);font-size:15px}
ul.plain{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
textarea{width:100%;background:var(--black);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:10px;font:inherit;font-size:14px;min-height:150px}
[hidden]{display:none!important}
</style>
</head>

  {id:"g1", max:0, t:"Hype money comes out of fun money.", d:"Investment money and emergency money never chase a tip from work."},
  {id:"g2", max:1, t:"Check on schedule.", d:"Looking every day is how people talk themselves into selling. Price follows profit."},
  {id:"sell", t:"You'd sell in a drop.", d:"VOO fell about 18% in 2022 and hit a new high by January 2024. The people who sold locked in the loss and missed the way back."}
];

var PROFILES = {
  low:{name:"Steady Ground", line:"Protect what you have built. Set the system up before you open it up.",
       mix:"Start with VOO as close to your whole portfolio as it gets. One company at most until your fix list is done."},
  mid:{name:"Balanced Builder", line:"You have room to grow, with a base that holds. Keep the base heavy.",
       mix:"VOO stays your base. Two of your four companies on top, bought on schedule."},
  high:{name:"Full Throttle", line:"Your money and your gut can both take a hit. Use it with discipline.",
        mix:"Index funds/ETFs stay your base. Pick two to four companies that pass all four of our questions."}
};

/* ---------- Scoring (pure) ---------- */
function band(p){ return p >= 70 ? "high" : p >= 40 ? "mid" : "low"; }
var SELLS=[["h1",0],["h1",1],["h2",0],["h3",0],["h3",1],["h4",0]];
function score(ans,picks){
  var cap=0, capMax=0, sto=0, stoMax=0;
  QUESTIONS.forEach(function(q){
    var v = ans[q.id];
    if (q.side==="cap"){ capMax+=3; cap+= (v==null?0:v); }
    else { stoMax+=3; sto+= (v==null?0:v); }
  });
  var cp = Math.round(cap/capMax*100), sp = Math.round(sto/stoMax*100);
  var cb = band(cp), sb = band(sp);
  var order = {low:0, mid:1, high:2};
  var prof = order[cb] <= order[sb] ? cb : sb;
  var fixes = FIXES.filter(function(f){
    if (f.id==="sell") return SELLS.some(function(x){ return picks && picks[x[0]]===x[1]; });
    return ans[f.id] != null && ans[f.id] <= f.max;
  });
  var gap = order[sb] > order[cb] ? "gut" : order[cb] > order[sb] ? "money" : "even";
  return {cap:cp, sto:sp, capBand:cb, stoBand:sb, profile:prof, fixes:fixes, gap:gap};
}

/* ---------- App ---------- */
var state = {step:-1, ans:{}, pick:{}, bal:EXAMPLE};
var app = document.getElementById("app");
function $(h){ var d=document.createElement("div"); d.innerHTML=h.trim(); return d.firstChild; }
function money(n){ return "$" + Math.round(n).toLocaleString("en-US"); }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;"); }

function render(){
  app.innerHTML="";
  if (state.step===-1) return intro();
  if (state.step===-2) return balance();
  if (state.step>=QUESTIONS.length) return result();
  question();
  window.scrollTo(0,0);
}

function intro(){
  app.appendChild($(
  '<div class="stack">'+
    '<p class="eyebrow">The everyday earner edition</p>'+
    '<h1>Financial Stress Test</h1>'+
    '<p>Everybody says they can handle risk when the account is green. This test puts your money through the bad days and shows you two things.</p>'+
    '<div class="two">'+
      '<div class="card"><h3>Capacity</h3><p class="small">Can your money take a hit? Emergency fund, steady paycheck, bills, who counts on you.</p></div>'+
      '<div class="card"><h3>Stomach</h3><p class="small">Can you take a hit? What you do when the screen is red.</p></div>'+
    '</div>'+
    '<div class="card"><p><b>17 questions. About 6 minutes.</b></p>'+
      '<p class="small muted">Your answers stay on this phone. Nobody sees them. At the end, you copy your result and send it to Julio. Answer what you would do, not what sounds right.</p></div>'+
    '<button class="btn" id="go">Start the test</button>'+
  '</div>'));
  document.getElementById("go").onclick=function(){ state.step=0; render(); };
}

function drive(){
  var n = state.step+1, t = QUESTIONS.length, q = QUESTIONS[state.step];
  return '<div class="drive"><div class="drive-top"><span>'+PARTS[q.part]+'</span><span>'+n+' of '+t+'</span></div>'+
         '<div class="track"><div class="fill" style="width:'+Math.round((n-1)/t*100)+'%"></div></div></div>';
}

function balance(){
  app.appendChild($(
  '<div class="stack">'+
    '<div class="eyebrow">Part 2 · The hits</div>'+
    '<h2>Put a real number on it.</h2>'+
    '<p>A percent is easy to shrug off. Dollars hit different. Type what is in your investment account, or what you plan to have in it a year from now.</p>'+
    '<div class="stack" style="gap:6px"><label for="bal">Investment account balance</label>'+
      '<div class="money"><span>$</span><input id="bal" inputmode="numeric" autocomplete="off" value="'+state.bal.toLocaleString("en-US")+'"></div>'+
      '<p class="small muted">Stays on this phone. Not sure? Leave the example number, $10,000.</p></div>'+
    '<div class="nav"><button class="btn ghost" id="back">Back</button><button class="btn" id="next">Run the hits</button></div>'+
  '</div>'));
  var inp=document.getElementById("bal");
  inp.oninput=function(){
    var v=parseInt(inp.value.replace(/[^0-9]/g,""),10);
    inp.value = isNaN(v) ? "" : v.toLocaleString("en-US");
  };
  document.getElementById("back").onclick=function(){ state.step=firstOfPart(2)-1; state.balBack=true; render(); };
  document.getElementById("next").onclick=function(){
    var v=parseInt(inp.value.replace(/[^0-9]/g,""),10);
    state.bal = (isNaN(v)||v<=0) ? EXAMPLE : v;
    state.balDone=true; state.step=firstOfPart(2); render();
  };
}
function firstOfPart(p){ for (var i=0;i<QUESTIONS.length;i++) if (QUESTIONS[i].part===p) return i; }

function question(){
  var i=state.step, q=QUESTIONS[i];
  if (q.part===2 && !state.balDone){ state.step=-2; return render(); }
  var h='<div class="stack">'+drive();
  if (q.setup){
    h+='<div class="hit"><p class="small">'+esc(q.setup)+'</p>';
    if (q.drop) h+='<div class="big">'+money(state.bal)+' &rarr; <b>'+money(state.bal*(1-q.drop))+'</b></div>'+
                   '<p class="small muted">Down '+money(state.bal*q.drop)+' on the screen.</p>';
    h+='</div>';
  }
  h+='<h2>'+esc(q.q)+'</h2><div class="stack" style="gap:10px" id="opts"></div>'+
     '<div class="nav"><button class="btn ghost" id="back">Back</button><button class="btn" id="next" disabled>'+(i===QUESTIONS.length-1?"See my result":"Next")+'</button></div></div>';
  app.appendChild($(h));
  var opts=document.getElementById("opts"), next=document.getElementById("next");
  q.a.forEach(function(a,k){
    var b=document.createElement("button");
    b.className="opt"; b.type="button"; b.textContent=a[0];
    b.setAttribute("aria-pressed", state.pick[q.id]===k ? "true":"false");
    b.onclick=function(){
      state.pick[q.id]=k; state.ans[q.id]=a[1];
      [].forEach.call(opts.children,function(c){ c.setAttribute("aria-pressed","false"); });
      b.setAttribute("aria-pressed","true"); next.disabled=false;
    };
    opts.appendChild(b);
  });
  if (state.pick[q.id]!=null) next.disabled=false;
  next.onclick=function(){ state.step=i+1; render(); };
  document.getElementById("back").onclick=function(){
    if (i===firstOfPart(2)){ state.balDone=false; state.step=-2; }
    else state.step = i===0 ? -1 : i-1;
    render();
  };
}

var BANDWORD={low:"Low", mid:"Medium", high:"High"};
function meter(name,pct,b,sub){
  return '<div class="meter"><div class="meter-head"><div><h3>'+name+'</h3><p class="small muted">'+sub+'</p></div>'+
         '<div style="text-align:right"><div class="num">'+pct+'</div><span class="pill '+b+'">'+BANDWORD[b]+'</span></div></div>'+
         '<div class="bar"><i class="'+b+'" style="width:'+Math.max(pct,3)+'%"></i></div></div>';
}

function result(){
  var r=score(state.ans,state.pick), p=PROFILES[r.profile], B=state.bal;
  var gapLine = r.gap==="gut" ? "Your gut can take more than your money can right now. The system sets your speed. Fix the list below and your profile moves up."
              : r.gap==="money" ? "Your money can take more than your gut can. Size your picks so a red month doesn't make you sell."
              : "Your money and your gut line up. That's the spot to build from.";
  var rows=[["VOO, 2022",0.18],["QQQ, 2022",0.33],["S&P 500, 2008",0.37],["One company, like Nvidia in 2022",0.50]];
  var tb=rows.map(function(x){ return '<tr><td>'+x[0]+'</td><td class="n">-'+Math.round(x[1]*100)+'%</td><td class="n loss">-'+money(B*x[1])+'</td><td class="n">'+money(B*(1-x[1]))+'</td></tr>'; }).join("");
  var fx = r.fixes.length
    ? '<ul class="fix">'+r.fixes.map(function(f){ return '<li><b>'+f.t+'</b><span>'+f.d+'</span></li>'; }).join("")+'</ul>'
    : '<p>Nothing on the list. Your system is tight. Keep running it.</p>';
  var summary = "1%er University · Financial Stress Test\nProfile: "+p.name+"\nCapacity: "+r.cap+" ("+BANDWORD[r.capBand]+")\nStomach: "+r.sto+" ("+BANDWORD[r.stoBand]+")\nFix first: "+
    (r.fixes.length ? r.fixes.map(function(f){return f.t;}).join(" ") : "Nothing on the list.");

  app.appendChild($(
  '<div class="stack">'+
    '<div class="eyebrow">Your result</div>'+
    '<div class="profile"><p class="small muted">Your profile</p><h2>'+p.name+'</h2><p>'+p.line+'</p><hr class="rule"><p class="small"><b>Starting point:</b> '+p.mix+' Talk it through with Julio before you move any money.</p></div>'+
    '<div class="card">'+meter("Capacity",r.cap,r.capBand,"Can your money take a hit?")+'<hr class="rule">'+meter("Stomach",r.sto,r.stoBand,"Can you take a hit?")+
      '<p class="small">'+gapLine+'</p><p class="small muted">Your profile follows the lower of the two scores.</p></div>'+
    '<div class="card"><h3>Fix first</h3>'+fx+'</div>'+
    '<div class="card"><h3>Your '+money(B)+' on the bad days</h3>'+
      '<div style="overflow-x:auto"><table><thead><tr><th>The hit</th><th style="text-align:right">Drop</th><th style="text-align:right">Down</th><th style="text-align:right">Left</th></tr></thead><tbody>'+tb+'</tbody></table></div>'+
      '<p class="small muted">Find the row where you would sell. Your investments have to sit above that row.</p></div>'+
    '<div class="card"><h3>Send to Julio</h3><ul class="plain"><li>Your profile name and both scores.</li><li>Your fix list, and which one you start this month.</li><li>The row in the table where you would sell.</li></ul>'+
      '<button class="btn" id="copy">Copy my result</button><p class="small muted" id="copied" hidden>Copied. Paste it in a text to Julio or your notes. Your dollar amount is not in it.</p>'+
      '<textarea id="fallback" hidden readonly></textarea></div>'+
    '<button class="btn ghost" id="again">Take it again</button>'+
  '</div>'));
  document.getElementById("copy").onclick=function(){
    var ok=function(){ document.getElementById("copied").hidden=false; };
    var no=function(){ var t=document.getElementById("fallback"); t.hidden=false; t.value=summary; t.focus(); t.select(); };
    try{ navigator.clipboard.writeText(summary).then(ok,no); }catch(e){ no(); }
  };
  document.getElementById("again").onclick=function(){ state={step:-1,ans:{},pick:{},bal:EXAMPLE}; render(); window.scrollTo(0,0); };
  window.scrollTo(0,0);
}

if (typeof module!=="undefined") module.exports={score:score,QUESTIONS:QUESTIONS};
else render();
</script>
</body>
</html>
